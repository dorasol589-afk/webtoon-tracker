name: 댓글수 일일 수집

on:
  schedule:
    # 매일 09:03 UTC = 18:03 KST. 새 회차가 보통 저녁 10~11시(요일 전날 밤)에 올라오므로, 그 직전인 저녁 6시 무렵에
    # 수집해서 "다음 회차 올라오기 직전" 값을 잡는다(GitHub 예약 실행이 1~3시간 늦게 시작하는 일이 있어 밤 9시가 아니라
    # 6시로 잡음 - 수집에 약 80분 걸림). 정시(분=0)는 지연이 더 커서 피함.
    - cron: "3 9 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  collect-kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run collect:kakao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
