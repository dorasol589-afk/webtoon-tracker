name: 댓글수 일일 수집

on:
  schedule:
    # 매일 06:03 UTC = 15:03 KST. 새 회차는 보통 저녁 10~11시(요일 전날 밤)에 올라오는데, GitHub 예약 실행이 2~7시간까지 늦게
    # 시작하는 일이 있어(저녁 6시로 잡았을 때 실제로 7시간 뒤인 새벽 1시에 시작) 일부러 일찍 잡는다 - 늦어져도 저녁 안에 시작되도록.
    # 수집에 약 80분 걸림. 정시(분=0)는 지연이 더 커서 피함.
    - cron: "3 6 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  collect-kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run collect:kakao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
